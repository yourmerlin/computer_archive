<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>[untitled] home — you are____</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #fff;
      }

      .page {
        position: relative;
        width: 100vmin;
        height: 100vmin;
        background: #fff;
        margin: 0 auto;
      }

      .heading {
        position: absolute;
        top: 5.5%;
        left: 4.5%;
        font-family: "Roboto Mono", monospace;
        font-style: italic;
        font-weight: 300;
        font-size: 2.4vmin;
        color: #222;
        letter-spacing: 0.04em;
      }

      .lines-block {
        position: absolute;
        top: 22%;
        left: 24%;
        width: 57%;
        height: 55%;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(100% / 30 - 0.7px),
          #c8c8c8 calc(100% / 30 - 0.7px),
          #c8c8c8 calc(100% / 30)
        );
      }

      .signature {
        position: absolute;
        bottom: 7%;
        right: 4.5%;
        text-align: right;
        font-family: "Roboto Mono", monospace;
        font-style: italic;
        font-weight: 300;
        font-size: 1.9vmin;
        color: #222;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="heading">you are____</div>
      <div class="lines-block"></div>
      <div class="signature">
        love,<br />
        [untitled] home
      </div>
    </div>
  </body>
</html>
